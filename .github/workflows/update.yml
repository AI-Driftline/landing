# Keeps aidriftline.com and @aidriftline in step with the product registry, four times a day:
# rebuild the model pages from the registry on product main, commit if anything changed, post alerts to X,
# compare the registry with the three provider pages by script (opens an issue on any difference),
# publish articles written from the registry, and create one dev.to draft per run for Mirza to publish.
name: update
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

concurrency: update

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AI-Driftline/driftline
          ref: main
          path: product-src
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # First compare with the provider pages: entries that no longer match go to feed/disputed.json, and the
      # build marks them "under review" in the live list (Action, MCP, emails and posts then hold back).
      - name: Check registry against provider pages
        id: check
        continue-on-error: true # a broken check must never stop the site from building
        run: node product-src/tools/check-pages.mjs product-src/registry/models.json --state feed/page-ids.json --out "$RUNNER_TEMP/registry-check.md" --disputed feed/disputed.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild pages
        id: build
        run: node tools/build.mjs product-src/registry/models.json
      - name: Open, update or close the registry-check issue
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          gh label create registry-check --color D93F0B --description "Registry differs from a provider page" --force >/dev/null 2>&1 || true
          n=$(gh issue list --label registry-check --state open --json number --jq '.[0].number // empty')
          if [ "$PROBLEMS" != "0" ]; then
            if [ -z "$n" ]; then
              gh issue create --title "Registry differs from the provider pages" --label registry-check --body-file "$RUNNER_TEMP/registry-check.md"
            else
              # Only touch the issue when the list itself changed (line 1 is just the timestamp), so no repeat emails.
              if [ "$(gh issue view "$n" --json body --jq .body | tail -n +2 | tr -d '[:space:]')" != "$(tail -n +2 "$RUNNER_TEMP/registry-check.md" | tr -d '[:space:]')" ]; then
                gh issue edit "$n" --body-file "$RUNNER_TEMP/registry-check.md"
                gh issue comment "$n" --body "The list of differences changed; see the updated description."
              fi
              # Not fixed yet: one reminder per full day open (at most 3), so a difference can't sit unnoticed.
              age=$(( $(date -u +%s) - $(date -u -d "$(gh issue view "$n" --json createdAt --jq .createdAt)" +%s) ))
              sent=$(gh issue view "$n" --json comments --jq '[.comments[].body | select(startswith("Still open"))] | length')
              due=$(( age / 86400 ))
              if [ "$due" -gt "$sent" ] && [ "$sent" -lt 3 ]; then
                gh issue comment "$n" --body "Still open after $due day(s): the registry still differs from the provider pages, so Driftline marks these models as under review. Fix registry/models.json in AI-Driftline/driftline, or ask Claude to."
              fi
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "The registry matches the provider pages again ($(date -u '+%F %H:%M') UTC)."
          fi
      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node tools/x-feed.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: dev.to draft
        id: devto
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node tools/devto-draft.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tell Mirza a dev.to draft is ready
        if: always() && steps.devto.outputs.title
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.devto.outputs.title }}
          SITE_URL: ${{ steps.devto.outputs.site }}
        run: |
          gh label create devto-draft --color 3B49DF --description "A dev.to draft is waiting to be published" --force >/dev/null 2>&1 || true
          printf 'A new draft is waiting on dev.to: https://dev.to/dashboard\n\nIt is the dev.to copy of %s (canonical link already set). Read it, change a line if you like, then click Publish. Close this issue when done.\n' "$SITE_URL" > "$RUNNER_TEMP/devto.md"
          gh issue create --title "dev.to draft ready: $TITLE" --label devto-draft --body-file "$RUNNER_TEMP/devto.md"
      - name: Commit and publish
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf product-src
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from registry $(date -u +%F)"
          git push
          # Pushes made with the workflow token may not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request failed (the push may still deploy)."
