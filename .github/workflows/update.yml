# Keeps aidriftline.com and @aidriftline in step with the product registry, four times a day:
# rebuild the model pages from the registry on product main, commit if anything changed, post alerts to X,
# compare the registry with the three provider pages by script (opens an issue on any difference),
# publish articles written from the registry, and create one dev.to draft per run for Mirza to publish.
name: update
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

concurrency: update

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AI-Driftline/driftline
          ref: main
          path: product-src
          fetch-depth: 0 # full registry history for the status page's "recent changes" and last AI check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # First compare with the provider pages: entries that no longer match go to feed/disputed.json, and the
      # build marks them "under review" in the live list (Action, MCP, emails and posts then hold back).
      - name: Check registry against provider pages
        id: check
        continue-on-error: true # a broken check must never stop the site from building
        run: node product-src/tools/check-pages.mjs product-src/registry/models.json --state feed/page-ids.json --out "$RUNNER_TEMP/registry-check.md" --disputed feed/disputed.json --summary "$RUNNER_TEMP/pages-summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # Read-only check of every platform page too, for aidriftline.com/status/ (when each source was last read).
      - name: Check every source for the status page
        continue-on-error: true
        run: node product-src/tools/status.mjs product-src/registry/models.json --pages "$RUNNER_TEMP/pages-summary.json" --out feed/status.json
      - name: Marketing article (1st and 3rd Tuesday)
        continue-on-error: true
        run: node tools/marketing.mjs blog | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rebuild pages
        id: build
        run: node tools/build.mjs product-src/registry/models.json
      - name: Open, update or close the registry-check issue
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          gh label create registry-check --color D93F0B --description "Registry differs from a provider page" --force >/dev/null 2>&1 || true
          n=$(gh issue list --label registry-check --state open --json number --jq '.[0].number // empty')
          if [ "$PROBLEMS" != "0" ]; then
            if [ -z "$n" ]; then
              url=$(gh issue create --title "Registry differs from the provider pages" --label registry-check --body-file "$RUNNER_TEMP/registry-check.md")
              # Start the AI registry check now instead of at its next morning run (API trigger; needs the
              # ROUTINE_FIRE_TOKEN secret from claude.ai/code/routines → task → Edit → Trigger + → API).
              if [ -n "$ROUTINE_FIRE_TOKEN" ]; then
                jq -n --arg t "The page check opened $url with these differences. Fix them as your instructions say: $(cat "$RUNNER_TEMP/registry-check.md")" '{text: $t}' \
                  | curl -sS -m 30 -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_019fF1zPXDCTGaxRVieWN5Wg/fire" \
                      -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" -H "anthropic-beta: experimental-cc-routine-2026-04-01" -H "anthropic-version: 2023-06-01" -H "Content-Type: application/json" -d @- >/dev/null \
                  && echo "Started the AI registry check." || echo "Could not start the AI registry check; it runs at 22:00 UTC anyway."
              fi
            else
              # Only touch the issue when the list itself changed (line 1 is just the timestamp), so no repeat emails.
              if [ "$(gh issue view "$n" --json body --jq .body | tail -n +2 | tr -d '[:space:]')" != "$(tail -n +2 "$RUNNER_TEMP/registry-check.md" | tr -d '[:space:]')" ]; then
                gh issue edit "$n" --body-file "$RUNNER_TEMP/registry-check.md"
                gh issue comment "$n" --body "The list of differences changed; see the updated description."
              fi
              # Not fixed yet: one reminder per full day open (at most 3), so a difference can't sit unnoticed.
              age=$(( $(date -u +%s) - $(date -u -d "$(gh issue view "$n" --json createdAt --jq .createdAt)" +%s) ))
              sent=$(gh issue view "$n" --json comments --jq '[.comments[].body | select(startswith("Still open"))] | length')
              due=$(( age / 86400 ))
              if [ "$due" -gt "$sent" ] && [ "$sent" -lt 3 ]; then
                gh issue comment "$n" --body "Still open after $due day(s): the registry still differs from the provider pages, so Driftline marks these models as under review. Fix registry/models.json in AI-Driftline/driftline, or ask Claude to."
              fi
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "The registry matches the provider pages again ($(date -u '+%F %H:%M') UTC)."
          fi
      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node tools/x-feed.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Marketing post on X (Mon, Wed, Fri)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node tools/marketing.mjs x | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Marketing queue check
        id: queue
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: node tools/marketing.mjs status | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or close the "marketing queue running low" issue
        if: always() && steps.queue.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LOW: ${{ steps.queue.outputs.low }}
          X_LEFT: ${{ steps.queue.outputs.x_left }}
          BLOG_LEFT: ${{ steps.queue.outputs.blog_left }}
        run: |
          gh label create marketing --color C6F432 --description "Marketing post queue" --force >/dev/null 2>&1 || true
          n=$(gh issue list --label marketing --state open --json number -q '.[0].number')
          if [ -z "$LOW" ]; then [ -n "$n" ] && gh issue close "$n" --comment "Queue filled again: $X_LEFT X post(s), $BLOG_LEFT article(s)."; exit 0; fi
          if [ -n "$n" ]; then echo "Low-queue issue already open."; exit 0; fi
          printf 'The marketing queue has %s X post(s) and %s article(s) left. The monthly routine drafts more as a pull request; merge it to approve them, or add items to marketing/ by hand (see marketing/README.md). Close this issue once the queue is filled.\n' "$X_LEFT" "$BLOG_LEFT" > "$RUNNER_TEMP/queue.md"
          gh issue create --title "Marketing queue running low" --label marketing --body-file "$RUNNER_TEMP/queue.md"
      - name: dev.to draft
        id: devto
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node tools/devto-draft.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tell Mirza a dev.to draft is ready
        if: always() && steps.devto.outputs.title
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.devto.outputs.title }}
          SITE_URL: ${{ steps.devto.outputs.site }}
        run: |
          gh label create devto-draft --color 3B49DF --description "A dev.to draft is waiting to be published" --force >/dev/null 2>&1 || true
          printf 'A new draft is waiting on dev.to: https://dev.to/dashboard\n\nIt is the dev.to copy of %s (canonical link already set). Read it, change a line if you like, then click Publish. Close this issue when done.\n' "$SITE_URL" > "$RUNNER_TEMP/devto.md"
          gh issue create --title "dev.to draft ready: $TITLE" --label devto-draft --body-file "$RUNNER_TEMP/devto.md"
      - name: Commit and publish
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf product-src
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from registry $(date -u +%F)"
          git push
          # Pushes made with the workflow token may not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request failed (the push may still deploy)."
          # Tell Bing (and the other IndexNow engines) which URLs just changed, once Pages has had time to deploy.
          # Google doesn't use IndexNow; it reads the sitemap dates. A failed ping never fails the run.
          n=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("feed/indexnow.json","utf8")).length)')
          if [ "$n" -gt 0 ]; then
            sleep 90
            node -e 'const u=JSON.parse(require("fs").readFileSync("feed/indexnow.json","utf8")).slice(0,10000);process.stdout.write(JSON.stringify({host:"aidriftline.com",key:"54eb6b5c111c1ea73b03a1b98e9d9e17",keyLocation:"https://aidriftline.com/54eb6b5c111c1ea73b03a1b98e9d9e17.txt",urlList:u}))' > "$RUNNER_TEMP/indexnow.json"
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data-binary @"$RUNNER_TEMP/indexnow.json" || echo 000)
            echo "IndexNow: sent $n changed URLs, answer $code (200/202 = accepted)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
